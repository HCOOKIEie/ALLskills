name: Check SkillAtlas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax and directory behavior
        run: |
          node --check main.js
          node --check core.js
          node --test tests/core.test.js
      - name: Check collector reliability without external requests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
